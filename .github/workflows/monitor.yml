name: CGV Monitor

# v7 — 사용량(러너 분) 한도를 넘지 않도록 만든 버전
#  · 기본 서버는 a, d 두 대 (Repository variable WORKERS 로 바꿀 수 있음. 예: "a" 또는 "a,b,c,d")
#  · 감시 시간대(KST) 제한: Repository variable ACTIVE_START / ACTIVE_END (기본 0 ~ 24 = 하루 종일)
#  · 종료일: Repository variable STOP_DATE (기본 2026-11-15). 이 날짜가 지나면 알아서 멈춤
#  · 프록시 주고받기(proxy-bus)는 없앴어요 → 저장소에 쓰기 권한이 필요 없음

on:
  workflow_dispatch:
    inputs:
      restart:
        description: "자동 재시작 여부 (직접 실행 시 false)"
        default: "false"
      minutes:
        description: "이번 실행 최대 유지 시간(분). 테스트는 5, 평소는 330"
        default: "330"
      worker:
        description: "감시 서버. default = WORKERS 변수(기본 a,d) / all = a·b·c·d / 한 글자 = 그 서버만"
        type: choice
        options: [default, all, a, b, c, d]
        default: default
      roster:
        description: "(자동 재시작용) 전체 서버 목록. 건드리지 마세요"
        default: ""
  schedule:
    - cron: "5 * * * *"   # 끊겼을 때를 위한 백업. 1시간마다 (자주 돌릴수록 사용량이 늘어요)

permissions:
  contents: read
  actions: write    # 끝나면 스스로 다시 실행하기 위해서만 필요

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      workers: ${{ steps.p.outputs.workers }}
      roster: ${{ steps.p.outputs.roster }}
    steps:
      - id: p
        env:
          W: ${{ inputs.worker }}
          ROSTER_IN: ${{ inputs.roster }}
          DEFAULT_WORKERS: ${{ vars.WORKERS || 'a,d' }}
        run: |
          tojson() { echo "$1" | tr -d ' ' | awk -F, '{printf "["; for(i=1;i<=NF;i++){printf "%s\"%s\"", (i>1?",":""), $i} printf "]"}'; }
          if [ -n "$ROSTER_IN" ]; then ROSTER="$ROSTER_IN"
          elif [ "$W" = "all" ]; then ROSTER="a,b,c,d"
          else ROSTER="$DEFAULT_WORKERS"; fi
          case "$W" in
            a|b|c|d) LIST="$W" ;;
            all) LIST="a,b,c,d" ;;
            *) LIST="$ROSTER" ;;
          esac
          echo "workers=$(tojson "$LIST")" >> "$GITHUB_OUTPUT"
          echo "roster=$(echo "$ROSTER" | tr -d ' ')" >> "$GITHUB_OUTPUT"

  watch:
    name: watch (${{ matrix.worker }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.workers) }}
    concurrency:
      group: cgv-monitor-${{ matrix.worker }}
      cancel-in-progress: false
    steps:
      # 실제로 시작하는 시각 기준으로 "지금 돌려도 되는지 / 몇 분 돌릴지" 결정 (줄 서 있다가 늦게 시작해도 정확함)
      - id: win
        env:
          START: ${{ vars.ACTIVE_START || '0' }}
          END: ${{ vars.ACTIVE_END || '24' }}
          STOP_DATE: ${{ vars.STOP_DATE || '2026-11-15' }}
          MAXMIN: ${{ inputs.minutes || '330' }}
          EVENT: ${{ github.event_name }}
          RESTART: ${{ inputs.restart }}
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          H=$(TZ=Asia/Seoul date +%-H)
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$RESTART" != "true" ]; then
            echo "수동 실행 → 시간대·종료일 제한 없이 시작"
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "minutes=$MAXMIN" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$today" > "$STOP_DATE" ]]; then
            echo "종료일($STOP_DATE)이 지나 쉽니다"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$H" -lt "$START" ] || [ "$H" -ge "$END" ]; then
            echo "감시 시간대($START~$END시) 밖이라 쉽니다 (지금 ${H}시)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          now=$(date +%s)
          if [ "$END" -ge 24 ]; then endts=$(( $(TZ=Asia/Seoul date -d "$today 23:59:59" +%s) + 1 ))
          else endts=$(TZ=Asia/Seoul date -d "$today $(printf '%02d' "$END"):00:00" +%s); fi
          left=$(( (endts - now) / 60 ))
          mins=$(( left < MAXMIN ? left : MAXMIN ))
          if [ "$mins" -lt 2 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "이번 실행 ${mins}분"
          echo "go=true" >> "$GITHUB_OUTPUT"; echo "minutes=$mins" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.win.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.win.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache/restore@v4
        if: steps.win.outputs.go == 'true'
        with:
          path: state.json
          key: state-${{ matrix.worker }}-${{ github.run_id }}
          restore-keys: state-${{ matrix.worker }}-

      - uses: actions/cache@v4
        if: steps.win.outputs.go == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Prepare browser
        if: steps.win.outputs.go == 'true'
        timeout-minutes: 8
        run: |
          pip install -r requirements.txt
          if [ -x /usr/bin/google-chrome ] || [ -x /opt/google/chrome/chrome ]; then
            echo "BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
            echo "러너의 Chrome을 사용합니다"
          else
            playwright install --with-deps chromium
          fi

      - name: Run monitor
        if: steps.win.outputs.go == 'true'
        run: python -u monitor.py
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}          # 중요 알림 전용 채널 (예매 오픈, 감시 중단)
          DISCORD_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_LOG_WEBHOOK_URL }}  # 상태/오류 로그 채널 (선택. 없으면 로그 알림 꺼짐)
          PROXY_URL: ${{ secrets.PROXY_URL }}                              # 선택: 유료 한국 IP 프록시
          WORKER: ${{ matrix.worker }}
          ROSTER: ${{ needs.plan.outputs.roster }}
          PROXY_MODE: ${{ matrix.worker == 'd' && 'free' || '' }}          # 서버 D만 무료 프록시 사용
          SEND_START_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.restart != 'true' }}
          CUTOFF_DATE: "2026-10-30"
          LOOP_MINUTES: ${{ steps.win.outputs.minutes }}
          INTERVAL_SEC: "180"      # 서버 1대 기준 간격. 서버끼리 균등하게 엇갈려서 합쳐서 확인
          SHOT_MODE: "edit"        # edit: 로그 채널의 메시지 1개를 계속 수정 | each: 매번 새 메시지 | off
          HEARTBEAT_MIN: "60"      # 정상 작동 알림 간격(분, 로그 채널)
          ERR_NOTICE_MIN: "30"     # 차단/오류 알림은 서버마다 30분에 한 번
          GAP_ALERT_MIN: "90"      # 이 시간 넘게 확인 못 하면 중요 알림
          MAX_BLOCKED: "3"         # 연속 3번 차단되면 종료 → 새 서버(새 IP)로 재시작
          MENTION: ""              # 예매 오픈 알림 멘션. 예: "@everyone"

      - uses: actions/upload-artifact@v4
        if: always() && steps.win.outputs.go == 'true'
        with:
          name: debug-${{ matrix.worker }}
          path: debug.jpg
          retention-days: 1
          if-no-files-found: ignore

      - name: Save state
        if: always() && steps.win.outputs.go == 'true' && hashFiles('state.dirty') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ matrix.worker }}-${{ github.run_id }}

      - name: Restart itself
        if: (success() || failure()) && steps.win.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }} -f restart=true -f minutes=330 -f worker=${{ matrix.worker }} -f roster=${{ needs.plan.outputs.roster }}
